name: Проверка лички и монтаж

on:
  schedule:
    # каждые 10 минут, 07:00–23:50 МСК (в cron время UTC, МСК = UTC+3)
    - cron: "*/10 4-20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# два запуска одновременно читали бы одну и ту же почту — ставим в очередь
concurrency:
  group: arinastroys-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Поставить зависимости
        run: pip install -r requirements.txt

      - name: Убедиться, что ffmpeg на месте
        run: |
          which ffmpeg || sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Фирменные шрифты
        run: |
          mkdir -p assets/fonts
          B=https://raw.githubusercontent.com/google/fonts/main
          get() { [ -s "assets/fonts/$2" ] || curl -fsSL "$1" -o "assets/fonts/$2" || echo "не скачался: $2"; }
          get "$B/ofl/oswald/Oswald%5Bwght%5D.ttf" Oswald-Variable.ttf
          get "$B/ofl/golostext/GolosText%5Bwght%5D.ttf" GolosText-Variable.ttf
          get "$B/ofl/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf" JetBrainsMono-Variable.ttf
          ls -la assets/fonts

      - name: Разобрать почту, смонтировать, опубликовать
        working-directory: scripts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          BRAND_CHANNEL: ${{ vars.BRAND_CHANNEL }}
          CONTACT_USERNAME: ${{ vars.CONTACT_USERNAME }}
          POST_DAYS: ${{ vars.POST_DAYS }}
          POST_TIME: ${{ vars.POST_TIME }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
        run: python tick.py

      - name: Сохранить состояние
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: |
          git config user.name "arinastroys-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/session.json
          if git diff --quiet --cached; then
            echo 'состояние не менялось, коммит не нужен'
            exit 0
          fi
          git commit -m "state: обновление"
          # Пока прогон работал, в ветку могли положить коммит (например, правку кода).
          # Тогда push отбивают. Состояние всегда берём НАШЕ: этот заход уже разобрал
          # почту, и откат затёр бы offset и статусы постов — работа пропала бы молча.
          for try in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "состояние сохранено с попытки $try"
              exit 0
            fi
            echo "push отбили (попытка $try), кладу своё состояние поверх свежей ветки"
            git fetch origin main
            cp state/session.json /tmp/session.json
            git reset --hard origin/main
            cp /tmp/session.json state/session.json
            git add state/session.json
            if git diff --quiet --cached; then
              echo 'в ветке уже лежит наше состояние'
              exit 0
            fi
            git commit -m "state: обновление"
            sleep 2
          done
          echo 'состояние сохранить не удалось'
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$OWNER_ID" \
            --data-urlencode text="Не смог сохранить состояние: последнее действие пропало, повтори его." \
            >/dev/null || true
          exit 1
