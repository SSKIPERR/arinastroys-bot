name: Проверка лички и монтаж

on:
  schedule:
    # каждые 10 минут, 07:00–23:50 МСК (в cron время UTC, МСК = UTC+3)
    - cron: "*/10 4-20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# два запуска одновременно читали бы одну и ту же почту — ставим в очередь
concurrency:
  group: arinastroys-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Поставить зависимости
        run: pip install -r requirements.txt

      - name: Убедиться, что ffmpeg на месте
        run: |
          which ffmpeg || sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Разобрать почту, смонтировать, опубликовать
        working-directory: scripts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          BRAND_CHANNEL: ${{ vars.BRAND_CHANNEL }}
          CONTACT_USERNAME: ${{ vars.CONTACT_USERNAME }}
          POST_DAYS: ${{ vars.POST_DAYS }}
          POST_TIME: ${{ vars.POST_TIME }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
        run: python tick.py

      - name: Сохранить состояние
        if: always()
        run: |
          git config user.name "arinastroys-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/session.json
          git diff --quiet --cached || git commit -m "state: обновление"
          git pull --rebase --quiet || true
          git push || true
